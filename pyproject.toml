# pyproject.toml
# LAYER: Project Configuration
# PURPOSE: Defines project metadata, dependencies, and build system requirements.
# WHY HERE: This is the standard PEP 621 way to manage Python projects. It ensures 
# that anyone cloning the repo can install the exact dependencies needed.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-bot"
version = "0.1.0"
description = "A robust, asynchronous Telegram bot for marketplace transactions using Clean Architecture."
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[ext]>=22.0, <23",
    "SQLAlchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "redis>=5.1.0",
    "arq>=0.26.0",
    "structlog>=24.4.0",
    "orjson>=3.10.7",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"